name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  notebook-smoke-test:
    # Runs the whole notebook on CPU against a fake Ollama API (tests/mock_ollama.py) with small embedding
    # and reranker models: every cell, including the benchmark, robustness suite and scorecard, must run.
    # It checks that the code paths work, not answer quality; quality comes from the real T4 run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAG_LOCAL_TEST: "1"
      RAG_BENCHMARK: "1"
      RAG_BENCH_LIMIT: "8"
      RAG_EMBED: BAAI/bge-small-en-v1.5
      RAG_RERANK: cross-encoder/ms-marco-MiniLM-L-6-v2
      RAG_SHARE: "0"
      RAG_DATA_DIR: ${{ github.workspace }}/rag_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "pymupdf>=1.24.10" "pymupdf4llm>=0.0.17" "langgraph>=0.2.60" "bm25s>=0.2.6" "PyStemmer>=2.2" \
            "faiss-cpu>=1.8.0" "sentence-transformers>=4.1.0" "langchain-text-splitters>=0.3.0" "pytesseract>=0.3.10" \
            "gradio>=5.0" pandas matplotlib requests psutil jupytext nbclient nbformat ipykernel
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-small-models-v1
      - name: Build the notebook from notebook_src.py
        run: python scripts/build_notebook.py
      - name: Start the fake Ollama API
        run: |
          python tests/mock_ollama.py > mock_ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
      - name: Run every cell
        run: python tests/run_notebook.py Agentic_RAG_PDF_Chatbot.ipynb executed.ipynb
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-notebook
          path: |
            executed.ipynb
            rag_data/benchmark/
            mock_ollama.log
